version: 2

updates:
  - package-ecosystem: uv
    directory: /
    # `main` solo recibe la promocion completa de `develop` (workflow Flujo de
    # ramas): una actualizacion abierta contra `main` nunca podria integrarse.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Las actualizaciones menores y de parche se agrupan para reducir ruido.
      uv-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # Las actualizaciones de seguridad se agrupan aparte y tienen prioridad.
      uv-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Los cambios de version mayor requieren revision humana y decision
      # arquitectonica explicita; no se automatizan.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
    ignore:
      # Python 3.14 en la imagen es un cambio de version de lenguaje, no un parche.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
